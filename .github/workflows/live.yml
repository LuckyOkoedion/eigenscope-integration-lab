name: Explicit live SDK and API check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
      - run: uv sync --locked --all-extras --python 3.12
      - name: Actual authorized synthetic SDK/API tests
        env:
          ORTHOCORE_API_KEY: ${{ secrets.ORTHOCORE_API_KEY }}
          ORTHOCORE_BASE_URL: https://eigenscope.guardianai.network
        run: uv run --no-sync eigenscope-lab live --output results/live.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: actual-sdk-api-results
          path: results/live.json
          retention-days: 14
