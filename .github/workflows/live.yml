name: Explicit live SDK and API check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.13.6'
      - run: uv sync --locked --all-extras --python 3.12
      - name: Actual authorized synthetic SDK/API tests
        env:
          ORTHOCORE_API_KEY: ${{ secrets.ORTHOCORE_API_KEY }}
          ORTHOCORE_BASE_URL: https://eigenscope.guardianai.network
        run: uv run --no-sync eigenscope-lab live --output results/live.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: actual-sdk-api-results
          path: results/live.json
          retention-days: 14
