name: Dependency audit

on:
  push:
    branches: [main]
    paths: [pyproject.toml, uv.lock, typescript/package-lock.json, .github/workflows/dependencies.yml]
  schedule:
    - cron: '19 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.6'
      - run: uv sync --locked --all-extras --python 3.12
      - run: uv run --no-sync pip-audit --format cyclonedx-json --output results/sbom.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: dependency-sbom
          path: results/sbom.json
          retention-days: 30
