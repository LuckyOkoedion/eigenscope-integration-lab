name: eigenscope-integration-lab
services:
  lab:
    build: .
    image: eigenscope-integration-lab:0.1.2
    ports:
      - "127.0.0.1:8765:8765"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 15s
